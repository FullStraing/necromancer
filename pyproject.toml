[project]
name = "necromancer"
version = "0.1.0"
description = "Resurrect bricked smart devices: recover a dead cloud protocol from evidence, prove it against the original client."
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27",
  "openai>=1.40",
  "pydantic>=2.7",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "uagents>=0.22",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
